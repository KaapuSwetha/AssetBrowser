<!-- ======================== base.html (HaloHues standard) ======================== -->
<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Asset Browser{% endblock %}</title>
    {% load static %}

    <link rel="icon" href="{% static 'icons/hhs_card.png' %}" type="image/png" />
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}" />
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}" />
    <link rel="stylesheet" href="{% static 'vendor/videojs/video-js.min.css' %}" />

    <!-- HaloHues base styles -->
    <link rel="stylesheet" href="{% static 'css/dist/base.css' %}" />

    {% block extra_head %}{% endblock %}
  </head>

  <body
    class="min-h-[100dvh] flex flex-col bg-gradient-to-br from-gray-900 via-gray-950 to-black text-slate-200 lg:overflow-hidden"
    hx-headers='{"X-CSRFToken":"{{ csrf_token }}"}'
  >
    <!-- ======================== HEADER ======================== -->
    <header
      class="sticky top-3 z-50 bg-gray-950/90 backdrop-blur border-b border-brand-900/30 mx-3 rounded-2xl"
    >
      <div
        class="w-full 2xl:max-w-[3840px] mx-auto px-3 sm:px-4 lg:px-6 h-14 flex items-center gap-3"
      >
        <!-- Brand -->
        <div
          class="shrink-0 flex items-center gap-2 text-[clamp(16px,1.1vw,18px)] font-semibold tracking-wide"
        >
          <i class="fas fa-cubes text-brand-400/90"></i>
          <span class="text-slate-100 whitespace-nowrap">Asset Browser</span>
        </div>

        <!-- Right cluster: search + notifications -->
        <div class="ml-auto flex items-center gap-3 min-w-0">
          <!-- Search Container -->
          <div
            id="searchContainer"
            class="relative w-full max-w-xs sm:max-w-sm md:max-w-md lg:max-w-lg"
          >
            <div class="relative">
              <i
                class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[15px]"
              ></i>
              <input
                id="globalSearch"
                name="q"
                type="search"
                aria-label="Search assets, or shots"
                autocomplete="off"
                placeholder="Search assets or shots here..."
                class="w-full h-11 pl-9 pr-4 rounded-2xl bg-slate-900/70 border border-slate-700/70 focus:ring-2 focus:ring-brand-500/60 focus:border-brand-500 text-slate-200 placeholder:text-slate-500 shadow-sm shadow-black/20"
                hx-get="{% url 'AssetView:search_assets' %}"
                hx-trigger="input changed delay:180ms, keyup[key=='Enter']"
                hx-target="#searchResultsContent"
                hx-swap="innerHTML"
              />
            </div>

            <!-- Toast Container -->
            <div
              id="toast-container"
              class="absolute top-full left-0 right-0 mt-2 z-[60] flex flex-col gap-2"
            ></div>

            <!-- Search Results Dropdown -->
            <div
              id="searchResults"
              class="absolute left-0 right-0 mt-2 max-h-[60vh] overflow-auto rounded-xl border border-slate-800 bg-slate-900/95 shadow-xl scroll-panel"
              role="listbox"
              aria-label="Search results"
            >
              <div id="searchResultsContent"></div>
            </div>
          </div>

          <!-- ════════════════════════════════════════════════
               NOTIFICATION BELL
               ════════════════════════════════════════════════ -->
          <div class="relative shrink-0" id="notifWrapper">
            <span
              id="notifCountBadge"
              style="
                display: none;
                position: absolute;
                top: -6px;
                right: -6px;
                min-width: 18px;
                padding: 0 5px;
                background: #e24b4a;
                color: #fff;
                font-size: 10px;
                font-weight: 700;
                line-height: 18px;
                border-radius: 20px;
                border: 2px solid #030712;
                text-align: center;
                white-space: nowrap;
                pointer-events: none;
                user-select: none;
                z-index: 10;
              "
            >0</span>
            <button
              id="notifButton"
              class="relative inline-flex items-center justify-center h-10 w-10 rounded-full transition-all duration-200 group"
              style="
                background: rgba(124, 58, 237, 0.1);
                border: 1px solid rgba(175, 169, 236, 0.33);
              "
              onmouseover="
                this.style.background = 'rgba(124,58,237,.22)';
                this.style.borderColor = 'rgba(124,58,237,.55)';
              "
              onmouseout="
                this.style.background = 'rgba(124,58,237,.1)';
                this.style.borderColor = 'rgba(175,169,236,.33)';
              "
              title="Notifications"
              aria-label="Notifications"
              aria-expanded="false"
              aria-haspopup="true"
            >
              <i
                id="notifBellIcon"
                class="far fa-bell text-[15px] transition-all duration-200"
                style="color: #a78bfa"
              ></i>
            </button>
            <div
              id="notifDropdown"
              class="hidden absolute right-0 top-[calc(100%+12px)] z-[70] w-[340px] sm:w-[380px] rounded-2xl overflow-hidden border border-white/[0.07]"
              style="
                background: linear-gradient(
                  145deg,
                  rgba(13, 13, 23, 0.98) 0%,
                  rgba(9, 9, 18, 0.99) 100%
                );
                backdrop-filter: blur(24px) saturate(180%);
                box-shadow:
                  0 24px 64px -12px rgba(0, 0, 0, 0.85),
                  0 0 0 1px rgba(139, 92, 246, 0.12),
                  inset 0 1px 0 rgba(255, 255, 255, 0.04);
              "
            >
              <div
                class="h-[2px] w-full overflow-hidden"
                style="background: rgba(255, 255, 255, 0.04)"
              >
                <div
                  id="notifPollBar"
                  class="h-full w-full"
                  style="
                    background: linear-gradient(90deg, #7c3aed, #4f46e5, #0ea5e9);
                  "
                ></div>
              </div>

              <div
                class="flex items-center justify-between px-4 py-3.5"
                style="
                  background: linear-gradient(
                    135deg,
                    rgba(139, 92, 246, 0.1) 0%,
                    rgba(79, 70, 229, 0.06) 50%,
                    rgba(14, 165, 233, 0.08) 100%
                  );
                  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                  padding: 10px;
                "
              >
                <div class="flex items-center gap-3">
                  <div
                    class="w-7 h-7 rounded-lg flex items-center justify-center"
                    style="
                      background: rgba(139, 92, 246, 0.2);
                      border: 1px solid rgba(139, 92, 246, 0.35);
                    "
                  >
                    <i class="fas fa-bell text-violet-400 text-[11px]"></i>
                  </div>
                  <span class="font-semibold text-slate-100 text-[13px] tracking-tight"
                    >Notifications</span
                  >
                  <span
                    id="notifHeaderCount"
                    class="hidden items-center gap-1.5 text-[10px] font-bold text-violet-300 px-2 py-0.5 rounded-full"
                    style="
                      background: rgba(139, 92, 246, 0.2);
                      border: 1px solid rgba(139, 92, 246, 0.3);
                    "
                  >
                    <span
                      class="w-1.5 h-1.5 rounded-full bg-violet-400 animate-pulse inline-block"
                    ></span>
                    <span id="notifHeaderCountText">0 new</span>
                  </span>
                </div>
                <button
                  id="markAllReadBtn"
                  class="hidden items-center gap-1.5 text-[10px] text-slate-400 hover:text-violet-300 transition-all duration-150 font-medium px-2.5 py-1 rounded-lg"
                  style="
                    background: rgba(255, 255, 255, 0.05);
                    border: 1px solid rgba(255, 255, 255, 0.08);
                  "
                  title="Mark all as read"
                >
                  <i class="fas fa-check-double text-[9px]"></i> Mark all read
                </button>
              </div>
              <div
                class="flex items-center gap-1 px-3 py-2"
                style="
                  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                  background: rgba(255, 255, 255, 0.02);
                "
              >
                <button
                  id="filterAll"
                  class="notif-filter-btn flex-1 text-[11px] font-semibold py-1.5 rounded-lg transition-all duration-150"
                  style="
                    background: rgba(139, 92, 246, 0.25);
                    border: 1px solid rgba(139, 92, 246, 0.45);
                    color: #c4b5fd;
                  "
                  onclick="setNotifFilter('all')"
                >All</button>
                <button
                  id="filter3days"
                  class="notif-filter-btn flex-1 text-[11px] font-semibold py-1.5 rounded-lg transition-all duration-150 flex items-center justify-center gap-1"
                  style="
                    background: rgba(255, 255, 255, 0.04);
                    border: 1px solid rgba(255, 255, 255, 0.08);
                    color: #64748b;
                  "
                  onclick="setNotifFilter('3days')"
                >
                  <i class="fas fa-clock text-[9px]"></i> 3 Days
                </button>
              </div>
              <div
                class="flex items-center gap-1 px-3 py-1.5"
                style="
                  border-bottom: 1px solid rgba(255, 255, 255, 0.04);
                  background: rgba(0, 0, 0, 0.18);
                "
              >
                <button
                  id="filterAsset"
                  class="notif-filter-btn flex-1 text-[10px] font-semibold py-1 rounded-lg transition-all duration-150 flex items-center justify-center gap-1"
                  style="
                    background: rgba(139, 92, 246, 0.2);
                    border: 1px solid rgba(139, 92, 246, 0.4);
                    color: #c4b5fd;
                  "
                  onclick="setNotifSubFilter('asset')"
                >
                  <i class="fas fa-cube text-[9px]"></i> Asset
                </button>
                <button
                  id="filterSequence"
                  class="notif-filter-btn flex-1 text-[10px] font-semibold py-1 rounded-lg transition-all duration-150 flex items-center justify-center gap-1"
                  style="
                    background: rgba(255, 255, 255, 0.03);
                    border: 1px solid rgba(255, 255, 255, 0.07);
                    color: #475569;
                  "
                  onclick="setNotifSubFilter('sequence')"
                >
                  <i class="fas fa-film text-[9px]"></i> Sequence
                </button>
              </div>
              <ul
                id="notifList"
                class="overflow-y-auto"
                style="max-height: calc(6 * 90px); scroll-behavior: smooth"
              ></ul>
              <div
                id="notifEmpty"
                class="hidden flex-col items-center justify-center py-12 gap-2"
                style="padding: 5px"
              >
                <div
                  class="h-14 rounded-2xl flex items-center justify-center mb-1"
                  style="
                    background: rgba(255, 255, 255, 0.03);
                    border: 1px solid rgba(255, 255, 255, 0.07);
                    width: 3rem;
                  "
                >
                  <i class="far fa-bell-slash text-2xl text-slate-600"></i>
                </div>
                <span class="text-[12px] font-medium text-slate-500">All caught up!</span>
                <span id="notifEmptySubtext" class="text-[10px] text-slate-600"
                  >No new notifications</span
                >
              </div>
              <div
                class="px-4 py-2.5 flex items-center justify-between"
                style="
                  border-top: 1px solid rgba(255, 255, 255, 0.05);
                  background: rgba(255, 255, 255, 0.02);
                "
              >
                <div class="flex items-center gap-1.5">
                  <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
                 
                </div>
                <button
                  id="refreshNotifBtn"
                  class="flex items-center gap-1 text-[10px] text-violet-500/70 hover:text-violet-400 transition font-medium"
                >
                  <i class="fas fa-rotate-right text-[9px]"></i> Refresh
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <template id="toastTemplate">
      <div
        class="animate-slideInDown flex items-start gap-3 px-4 py-3 rounded-xl shadow-lg backdrop-blur-sm border transition-all duration-300 w-full"
      >
        <i class="toast-icon text-lg shrink-0 mt-0.5"></i>
        <div class="flex-1 min-w-0">
          <div class="toast-title font-medium text-sm"></div>
          <div class="toast-message text-xs opacity-90 mt-0.5"></div>
        </div>
        <button
          onclick="this.closest('.toast').remove(); updateSearchResultsPosition();"
          class="shrink-0 hover:opacity-70 transition-opacity ml-2"
        >
          <i class="fas fa-times text-sm"></i>
        </button>
      </div>
    </template>

    <!-- ======================== MAIN CONTENT ======================== -->
    <main
      class="flex-1 min-h-0 px-3 sm:px-4 lg:px-6 py-3 sm:py-4 pb-16 overflow-y-auto lg:overflow-hidden"
    >
      {% block content %}{% endblock %}
    </main>

    <!-- ======================== FOOTER ======================== -->
    <footer
      class="sticky bottom-0 z-50 bg-gray-950/95 backdrop-blur border-t border-brand-900/30 shadow-[0_-8px_24px_-16px_rgb(0_0_0_/_0.7)] h-12"
    >
      <div
        class="w-full 2xl:max-w-[3840px] mx-auto h-full px-3 sm:px-4 lg:px-6 flex items-center justify-between text-[12px] text-slate-300"
      >
        <div class="flex items-center gap-2">
          <i class="fas fa-shield-alt text-sky-400/80"></i>
          <span class="font-medium">Asset Browser</span>
          <span class="mx-2 opacity-40">•</span>
          <span class="tracking-wide">HaloHues Studios</span>
        </div>
        <div>© 2025 HaloHues Studios. All rights reserved.</div>
      </div>
    </footer>

    <!-- ======================== GLOBAL SCRIPTS ======================== -->
    <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
    <script src="{% static 'vendor/videojs/video.min.js' %}"></script>

    <!--
      Expose Django URL-reversed notification endpoints to base.js.
      base.js reads window.NOTIF_URLS so it needs no Django template tags.
    -->
    <script>
      window.NOTIF_URLS = {
        list:    "{% url 'AssetView:get_notifications' %}",
        read:    "{% url 'AssetView:mark_notification_read' notification_id='__ID__' %}",
        markAll: "{% url 'AssetView:mark_all_notifications_read' %}",
        delete:  "{% url 'AssetView:delete_notification' notification_id='__ID__' %}",
      };
    </script>

    <!-- HaloHues base scripts -->
    <script src="{% static 'js/review/base.js' %}"></script>

    {% block extra_scripts %}{% endblock %}
  </body>
</html>
