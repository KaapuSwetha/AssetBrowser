<div id="previewCard"
     class="bg-gradient-to-b from-gray-900 via-gray-900/80 to-gray-950 border border-gray-800 rounded-2xl shadow-2xl flex-1 min-h-0 flex flex-col overflow-hidden backdrop-blur-sm">

    <!-- Header -->
    <div class="px-4 py-3 border-b border-gray-800 flex items-center gap-2 font-semibold text-xs uppercase tracking-widest text-slate-300 bg-gray-900/60">
        <i class="fas fa-eye text-fuchsia-400/90"></i>
        <span>Preview</span>
    </div>

    <!-- Content -->
    <div class="flex-1 flex items-center justify-center p-6">
        {% if media and media.type == 'video' %}
        <video controls
               class="max-h-full max-w-full rounded-xl border border-slate-800 shadow-md hover:shadow-fuchsia-500/20 transition duration-300 ease-in-out bg-black"
               preload="metadata">
            <source src="{{ media.src }}" type="video/mp4"/>
            Your browser does not support the video tag.
        </video>

        {% elif media and media.type == 'image' %}
        <div class="relative group">
            <img src="{{ media.src }}" alt="Preview"
                 class="max-h-[80vh] max-w-full rounded-xl border border-slate-800 shadow-md hover:shadow-fuchsia-500/20 transition duration-300 ease-in-out object-contain"/>
            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 rounded-xl transition"></div>
        </div>

        {% else %}
        <div class="text-center text-slate-500 text-sm flex flex-col items-center justify-center space-y-2">
            <i class="fas fa-photo-video fa-3x mb-1 text-slate-600"></i>
            <p class="text-slate-400">Select an item to preview</p>
            {% if media and media.message %}
            <p class="text-xs text-slate-500 italic">{{ media.message }}</p>
            {% endif %}
        </div>
        {% endif %}
    </div>
</div>
