{% comment %} status_form.html {% endcomment %}
<div class="absolute z-50" 
     id="statusForm-{{ uid }}"
     onclick="event.stopPropagation();">
  <div class="bg-slate-800/95 border border-slate-600 rounded-lg shadow-2xl overflow-hidden backdrop-blur-sm w-[260px]">
    <form
      hx-post="/update-status/"
      hx-swap="outerHTML"
      hx-target="this"
      onsubmit="this.querySelector('button[type=submit]').disabled=true"
    >
      <input type="hidden" name="uid" value="{{ uid }}"/>
      <input type="hidden" name="path" value="{{ path }}"/>
      <input type="hidden" name="mode" value="{{ mode }}"/>
      <input type="hidden" name="name" value="{{ name }}"/>
      <input type="hidden" name="variant" value="{{ variant }}"/>  
      <input type="hidden" name="index" value="{{ index }}"/>
      
      <!-- Status Selection -->
      <div class="px-4 py-2.5 border-b border-slate-600/50">
          <label class="block text-[9px] sm:text-[10px] md:text-xs font-medium text-slate-300 mb-1 md:mb-1.5">Status</label>
          <select name="status" class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-xs sm:text-xs md:text-sm text-slate-100 focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500">
          {% for s in statuses %}
            <option value="{{ s.text }}" {% if s.text == current_status %}selected{% endif %}>
              {{ s.text }}
            </option>
          {% endfor %}
        </select>
      </div>

      <!-- Comment -->
      <div class="px-4 py-2.5">
          <label class="block text-[9px] sm:text-[10px] md:text-xs font-medium text-slate-300 mb-1 md:mb-1.5">
          Comment <span class="text-red-400">*</span>
        </label>
          <textarea name="comment" rows="2"
                    class="w-full bg-slate-700 border border-slate-600 rounded px-2 py-1 text-xs sm:text-xs md:text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-emerald-500 focus:border-emerald-500 resize-none {% if error %}border-red-500{% endif %}"
                  placeholder="Add a note..."
                  required></textarea>
        
        {% if error %}
          <div class="mt-1.5 p-2 bg-red-900/30 border border-red-700 rounded text-red-300 text-xs">
            <i class="fas fa-exclamation-circle mr-1"></i> {{ error }}
          </div>
        {% endif %}
      </div>

      <!-- Buttons: inline, right-aligned -->
      <div class="px-3 py-2 bg-gradient-to-b from-slate-900/30 to-slate-900/60 border-t border-slate-600/50 flex items-center justify-end gap-2">
        <button type="submit"
                class="group relative inline-flex items-center px-3 py-1.5 rounded-md bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white text-sm font-semibold transition duration-150 gap-2 min-w-[72px]">
          <i class="fas fa-check text-sm group-hover:rotate-12 transition-transform duration-150"></i>
          <span>Save</span>
        </button>
        <button type="button"
          class="group relative inline-flex items-center px-3 py-1.5 rounded-md bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold transition duration-150 gap-2 min-w-[72px]"
          onclick="closeStatusForm('{{ uid }}')">
          <i class="fas fa-times text-sm group-hover:rotate-90 transition-transform duration-150"></i>
          <span>Cancel</span>
        </button>
      </div>
    </form>
  </div>
</div>

<script>
(function() {
  function closeStatusForm(uid) {
    const portalEl = document.getElementById('statusPortal-' + uid);
    const formEl = document.getElementById('statusForm-' + uid);
    if (formEl) {
      // remove resize/orientation/scroll handlers if attached
      if (formEl._statusResizeHandler) {
        window.removeEventListener('resize', formEl._statusResizeHandler);
        window.removeEventListener('orientationchange', formEl._statusResizeHandler);
        delete formEl._statusResizeHandler;
      }
      if (formEl._statusScrollHandler) {
        window.removeEventListener('scroll', formEl._statusScrollHandler, true);
        delete formEl._statusScrollHandler;
      }
      // Remove visual indicator from row
      var statusCell = document.getElementById('statusCell-' + uid) || portalEl.closest('[id^="statusCell-"]');
      if (statusCell) {
        var row = statusCell.closest('tr');
        if (row) {
          row.classList.remove('status-form-active');
          row.style.backgroundColor = '';
          row.style.outline = '';
          row.style.outlineOffset = '';
        }
      }
      if (formEl.parentElement) formEl.remove();
    }
    if (portalEl) portalEl.innerHTML = '';
  }
  // expose globally so inline onclick handlers can call it
  window.closeStatusForm = closeStatusForm;

  var allPortals = document.querySelectorAll('[id^="statusPortal-"]');
  allPortals.forEach(function(portal) {
    if (portal.id !== 'statusPortal-{{ uid }}') {
      var otherUid = portal.id.replace('statusPortal-','');
      closeStatusForm(otherUid);
    }
  });
  
  var form = document.getElementById('statusForm-{{ uid }}');
  var portal = document.getElementById('statusPortal-{{ uid }}');
  
  if (form && portal) {
    form.offsetHeight;

    var portalRect = portal.getBoundingClientRect();
    var formHeight = form.offsetHeight || 300;
    var viewportHeight = window.innerHeight;
    var viewportWidth = window.innerWidth;
    var spaceBelow = viewportHeight - portalRect.bottom;
    var spaceAbove = portalRect.top;

    // Find the table container to respect its boundaries
    var table = portal.closest('table');
    var tableRect = table ? table.getBoundingClientRect() : null;

    // Choose the inner panel (first child div) as target for width adjustments
    var panel = form.querySelector(':scope > div') || form;

    // Compute adaptive width: prefer default, but cap to table width and viewport
    var isMobile = viewportWidth < 640;
    var defaultWidth = isMobile ? 220 : 260; // slightly smaller on mobile
    var minWidth = isMobile ? 160 : 180;
    var maxWidthViewport = Math.floor(viewportWidth * 0.95);
    var maxWidthTable = tableRect ? Math.floor(tableRect.width - 16) : maxWidthViewport;
    var allowedMax = Math.max(minWidth, Math.min(maxWidthTable, maxWidthViewport));
    var finalWidth = Math.max(minWidth, Math.min(defaultWidth, allowedMax));
    panel.style.width = finalWidth + 'px';
    // also ensure panel doesn't force layout when portal is zero-size
    panel.style.maxWidth = allowedMax + 'px';
    
    // Move form to document body so it doesn't affect table layout, then position
    if (form.parentElement !== document.body) {
      document.body.appendChild(form);
    }
    
    // Add visual indicator to the row
    if (statusCell) {
      var row = statusCell.closest('tr');
      if (row) {
        row.classList.add('status-form-active');
        row.style.backgroundColor = 'rgba(16, 185, 129, 0.1)'; // emerald tint
        row.style.outline = '2px solid rgba(16, 185, 129, 0.5)';
        row.style.outlineOffset = '-2px';
      }
    }
    
    // close form when viewport size/orientation changes while open, or on scroll
    if (!form._statusResizeHandler) {
      var _resizeHandler = function() { closeStatusForm('{{ uid }}'); };
      var _scrollHandler = function() { closeStatusForm('{{ uid }}'); };
      window.addEventListener('resize', _resizeHandler);
      window.addEventListener('orientationchange', _resizeHandler);
      // Listen for scroll on window and any scrollable parent
      window.addEventListener('scroll', _scrollHandler, true);
      form._statusResizeHandler = _resizeHandler;
      form._statusScrollHandler = _scrollHandler;
    }

    // Determine the status cell to anchor the popup
    var statusCell = portal.closest('[id^="statusCell-"]') || document.getElementById('statusCell-{{ uid }}');
    var cellRect = statusCell ? statusCell.getBoundingClientRect() : portalRect;

    // Default absolute positioning relative to viewport (account for scroll)
    form.style.position = 'absolute';
    form.style.right = 'auto';
    form.style.transform = 'none';

    // Compute horizontal position: align right edge of popup to right edge of the cell
    var leftPos = Math.round(cellRect.right - finalWidth);
    // Clamp to viewport
    leftPos = Math.max(8, Math.min(leftPos, viewportWidth - finalWidth - 8));

    // UNIFIED VERTICAL POSITIONING LOGIC (same for mobile and desktop)
    // Determine row position within table for smart vertical placement
    var tableBody = statusCell ? statusCell.closest('tbody') : null;
    var currentRow = statusCell ? statusCell.closest('tr') : null;
    var allRows = tableBody ? Array.from(tableBody.querySelectorAll('tr')) : [];
    var rowIndex = currentRow && allRows.length ? allRows.indexOf(currentRow) : -1;
    var totalRows = allRows.length || 0;

    var isLastRows = (totalRows > 10 && rowIndex >= 0 && rowIndex >= totalRows - 3);

    var topPos;
    if (isLastRows && spaceAbove > formHeight + 12) {
      // For the last 3 rows, open upward when space allows
      topPos = Math.round(cellRect.top - formHeight - 6 + window.scrollY);
    } else if (spaceBelow > formHeight + 12) {
      // Otherwise prefer opening downward if space permits
      topPos = Math.round(cellRect.bottom + 8 + window.scrollY);
    } else if (spaceAbove > formHeight + 12) {
      // If no space below but enough above, open above
      topPos = Math.round(cellRect.top - formHeight - 6 + window.scrollY);
    } else {
      // Fallback: pin near top so form is visible
      topPos = Math.round(window.scrollY + 8);
    }

    form.style.left = leftPos + 'px';
    form.style.top = topPos + 'px';
    
    // Check if form would overflow on the right side
    setTimeout(function() {
      var formRect = form.getBoundingClientRect();
      
      // If we have table boundaries, respect them
      if (tableRect) {
        var tableRightEdge = tableRect.right - 10; // 10px padding from edge
        
        if (formRect.right > tableRightEdge) {
          // Form overflows table, align to right edge of table
          var overflowAmount = formRect.right - tableRightEdge;
          form.style.right = overflowAmount + 'px';
        }
        
        // Also check left boundary
        if (formRect.left < tableRect.left + 10) {
          form.style.right = 'auto';
          form.style.left = '10px';
          // shrink panel if still overflowing to left
          var overLeft = (tableRect.left + 10) - formRect.left;
          if (overLeft > 0) {
            var currentPanelWidth = panel.getBoundingClientRect().width;
            panel.style.width = Math.max(minWidth, currentPanelWidth - overLeft) + 'px';
          }
        }
      } else {
        // Fallback to viewport boundaries
        if (formRect.right > viewportWidth - 10) {
          var overflow = formRect.right - (viewportWidth - 10);
          var currentRight = parseInt(form.style.right) || 0;
          form.style.right = (currentRight + overflow) + 'px';
        }
      }
    }, 0);
  }
  
  document.addEventListener('click', function closeForm(e) {
    if (form && !form.contains(e.target)) {
      closeStatusForm('{{ uid }}');
      document.removeEventListener('click', closeForm);
    }
  });
})();
</script>
