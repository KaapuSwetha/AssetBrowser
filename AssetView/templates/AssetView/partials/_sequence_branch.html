{# AssetView/partials/_sequence_branch.html #}

<details class="group" data-key="seq:{{ project }}-{{ seq }}">
    <summary class="tree-row seq-summary"
             data-project="{{ project }}"
             data-seq-name="{{ seq }}">
        <i class="fa-solid fa-caret-right caret text-slate-400"></i>
        <i class="fa-regular fa-folder folder-closed ic-sequence"></i>
        <i class="fa-regular fa-folder-open folder-open ic-sequence"></i>
        <span class="font-medium">{{ seq }}</span>
        <span class="ml-1 rounded-full border border-emerald-500/60 text-emerald-300 text-xs px-2 py-0.5">
            {{ shots|length }} shots
        </span>

        <!-- Dropdown built dynamically on right-click -->
        <div class="seq-lineup-dropdown"
             style="display:none; position:fixed;"
             data-project="{{ project }}"
             data-seq="{{ seq }}"
             data-depts='[{% for s in shots %}{% for it in s.depts %}"{{ it.dept }}",{% endfor %}{% endfor %}]'>
        </div>
    </summary>

    <div class="tree-guide space-y-1">
        {% for s in shots %}
        <details class="group" data-key="shot:{{ project }}:{{ seq }}:{{ s.name }}">
            <summary class="tree-row zip-dl-node"
         data-dl-level="shot"
         data-dl-project="{{ project }}"
         data-dl-seq="{{ seq }}"
         data-dl-shot="{{ s.name }}">
                <i class="fa-solid fa-caret-right caret text-slate-400"></i>
                <i class="fa-regular fa-folder folder-closed ic-shot"></i>
                <i class="fa-regular fa-folder-open folder-open ic-shot"></i>
                <span>{{ s.name }}</span>
            </summary>

            <div class="tree-guide">
                {% for it in s.depts %}
                <div class="py-1 zip-dl-node"
                     data-dl-level="shot_dept"
                     data-dl-project="{{ project }}"
                     data-dl-seq="{{ seq }}"
                     data-dl-shot="{{ s.name }}"
                     data-dl-dept="{{ it.dept }}">
                    <a class="inline-flex items-center gap-2 text-slate-200 hover:underline"
                       hx-get="{% url 'AssetView:get_asset_versions' %}?path={{ it.path|urlencode }}&name={{ it.name|urlencode }}&mode={{ it.mode|urlencode }}"
                       hx-target="#versionsTable"
                       hx-swap="innerHTML"
                       hx-on:click="
                           htmx.ajax('GET',
                             '{% url 'AssetView:get_file_metadata' %}?path={{ it.path|urlencode }}&name={{ it.name|urlencode }}&mode={{ it.mode|urlencode }}',
                             {target:'#metadataCard', swap:'outerHTML'});
                       ">
                        <i class="fa-regular fa-file-lines ic-file"></i>
                        <span>{{ it.dept }}</span>
                    </a>
                </div>
                {% endfor %}
            </div>
        </details>
        {% endfor %}
    </div>
</details>

<style>
/* ── Primary dropdown ── */
.seq-lineup-dropdown {
  background: linear-gradient(160deg, #111827, #0f172a);
  border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
  box-shadow: 0 16px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
  min-width: 200px; padding: 4px; z-index: 9999;
  animation: seqDropIn .14s ease;
}
@keyframes seqDropIn {
  from { opacity: 0; transform: translateY(-6px) scale(.97); }
  to   { opacity: 1; transform: none; }
}

/* ── Group wrapper ── */
.seq-lineup-group { position: relative; }

/* ── Parent option row ── */
.seq-lineup-option {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 12px; border-radius: 7px;
  font-size: 13px; color: #cbd5e1; cursor: pointer;
  background: none; border: none; text-align: left;
  transition: background .15s, color .15s;
}
.seq-lineup-option:hover,
.seq-lineup-option.active { background: rgba(99,102,241,.18); color: #fff; }
.seq-lineup-option i { width: 16px; text-align: center; color: #818cf8; font-size: 13px; }
.seq-lineup-option:hover i,
.seq-lineup-option.active i { color: #a5b4fc; }

.seq-sub-chevron { margin-left: auto; font-size: 9px; color: #64748b; transition: transform .2s, color .15s; }
.seq-lineup-option.active .seq-sub-chevron { transform: rotate(90deg); color: #a5b4fc; }

/* ── Sub-menu ── */
.seq-lineup-submenu {
  display: none;
  overflow: hidden;
  background: rgba(255,255,255,.03);
  border-radius: 0 0 8px 8px;
  border-top: 1px solid rgba(255,255,255,.06);
}

.seq-lineup-suboption {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 8px 16px 8px 36px; border-radius: 6px;
  font-size: 12px; color: #94a3b8; cursor: pointer;
  background: none; border: none; text-align: left;
  transition: background .15s, color .15s;
}
.seq-lineup-suboption:hover { background: rgba(99,102,241,.18); color: #fff; }
.seq-lineup-suboption i { width: 14px; text-align: center; color: #6366f1; font-size: 12px; }
.seq-lineup-suboption:hover i { color: #a5b4fc; }

/* empty state */
.seq-lineup-empty {
  padding: 12px 14px; font-size: 12px; color: #64748b;
  text-align: center; font-style: italic;
}

/* ── Simple single-option zip menu (shot / shot+dept levels) ──
   NOTE: deliberately a DIFFERENT class name than the project tree's
   .zip-context-menu — sharing a class caused this script's "nothing
   matched, close menus" fallback to delete the project tree's menu
   for the Asset/Sequence top-level nodes on the very same click. */
.seq-zip-context-menu {
  position: fixed; z-index: 10000; min-width: 200px; padding: 4px;
  background: linear-gradient(160deg, #111827, #0f172a);
  border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
  box-shadow: 0 16px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
  animation: seqDropIn .14s ease;
}
.seq-zip-context-menu button {
  display:flex; align-items:center; gap:10px; width:100%;
  padding:9px 12px; border-radius:7px; font-size:13px; color:#cbd5e1;
  background:none; border:none; text-align:left; cursor:pointer;
  transition:background .15s, color .15s;
}
.seq-zip-context-menu button:hover { background: rgba(99,102,241,.18); color:#fff; }
.seq-zip-context-menu button i { width:16px; text-align:center; color:#818cf8; }

/* ── Download progress card ── */
#zipProgressContainer {
  position: fixed; bottom: 16px; right: 16px; z-index: 10000;
  display: flex; flex-direction: column; gap: 8px;
}
.zip-progress-card {
  width: 280px; background: linear-gradient(160deg, #111827, #0f172a);
  border: 1px solid rgba(255,255,255,.1); border-radius: 10px;
  box-shadow: 0 12px 30px rgba(0,0,0,.55);
  padding: 12px 14px; color: #e2e8f0; font-size: 12px;
  animation: seqDropIn .14s ease;
}
.zip-progress-card .zp-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-weight:600; }
.zip-progress-card .zp-title button { background:none; border:none; color:#94a3b8; cursor:pointer; font-size:12px; }
.zip-progress-card .zp-bar-track { height:6px; border-radius:4px; background:rgba(255,255,255,.08); overflow:hidden; }
.zip-progress-card .zp-bar-fill { height:100%; background:#6366f1; transition:width .2s ease; }
.zip-progress-card .zp-status { margin-top:6px; color:#94a3b8; }
.zip-progress-card.zp-error .zp-bar-fill { background:#f43f5e; }
.zip-progress-card.zp-done .zp-bar-fill { background:#10b981; }
</style>

<script>
if (!window._seqLineupInit) {
  window._seqLineupInit = true;

  /* ── Dept → icon mapping ── */
  window.DEPT_ICONS = {
    'animation':   'fas fa-running',
    'cache':       'fas fa-database',
    'matchmove':   'fas fa-camera',
    'lighting':    'fas fa-lightbulb',
    'compositing': 'fas fa-layer-group',
    'fx':          'fas fa-fire',
    'rigging':     'fas fa-project-diagram',
    'modeling':    'fas fa-cube',
    'rendering':   'fas fa-film',
    'layout':      'fas fa-drafting-compass',
  };

  window.getDeptIcon = function(dept) {
    const key = dept.toLowerCase().replace(/\s+/g, '');
    for (const [k, v] of Object.entries(window.DEPT_ICONS)) {
      if (key.includes(k)) return v;
    }
    return 'fas fa-folder';
  };

  window.buildSeqDropdown = function(dropdown) {
  if (dropdown.dataset.built) return;
  dropdown.dataset.built = '1';

  const project = dropdown.dataset.project;
  const seq     = dropdown.dataset.seq;

  let raw = [];
  try {
    const cleaned = (dropdown.dataset.depts || '[]').replace(/,\s*]$/, ']');
    raw = JSON.parse(cleaned);
  } catch(e) {
    console.error('[SeqLineup] Failed to parse depts JSON:', dropdown.dataset.depts, e);
  }

  const depts = [...new Set(raw.filter(Boolean))];

  const downloadAllHtml = `
    <button class="seq-lineup-option"
            onclick="event.stopPropagation();
                     closeAllSeqDropdowns();
                     window.treeDownload.start({dlLevel:'sequence', dlProject:'${project}', dlSeq:'${seq}'});">
      <i class="fas fa-file-zipper"></i>
      <span>Download ${project} as ZIP</span>
    </button>
  `;

  if (!depts.length) {
    dropdown.innerHTML = downloadAllHtml + '<div class="seq-lineup-empty">No departments found</div>';
    return;
  }

  dropdown.innerHTML = downloadAllHtml + depts.map(dept => `
    <div class="seq-lineup-group">
      <button class="seq-lineup-option seq-lineup-parent"
              onclick="event.stopPropagation(); toggleSubMenu(this);">
        <i class="${window.getDeptIcon(dept)}"></i>
        <span>${dept}</span>
        <i class="fas fa-chevron-right seq-sub-chevron"></i>
      </button>
      <div class="seq-lineup-submenu">
        <button class="seq-lineup-suboption"
                onclick="event.stopPropagation();
                         closeAllSeqDropdowns();
                         window.sequencePlayer && window.sequencePlayer.launch('${project}', '${seq}', '${dept}');">
          <i class="fas fa-play-circle"></i>
          <span>Play Continuous</span>
        </button>
        <button class="seq-lineup-suboption"
                onclick="event.stopPropagation();
                         closeAllSeqDropdowns();
                         window.sequencePlayer && window.sequencePlayer.launchSBS('${project}', '${seq}', '${dept}');">
          <i class="fas fa-columns"></i>
          <span>Side by Side</span>
        </button>
        <button class="seq-lineup-suboption"
                onclick="event.stopPropagation();
                         closeAllSeqDropdowns();
                         window.treeDownload.start({dlLevel:'department', dlProject:'${project}', dlSeq:'${seq}', dlDept:'${dept}', dlMode:'Sequence'});">
          <i class="fas fa-file-zipper"></i>
          <span>Download ${project} as ZIP</span>
        </button>
      </div>
    </div>
  `).join('');
};

  window.toggleSubMenu = function(btn) {
    const group   = btn.closest('.seq-lineup-group');
    const submenu = group.querySelector('.seq-lineup-submenu');
    const isOpen  = submenu.style.display === 'block';

    btn.closest('.seq-lineup-dropdown')
       .querySelectorAll('.seq-lineup-submenu')
       .forEach(s => s.style.display = 'none');
    btn.closest('.seq-lineup-dropdown')
       .querySelectorAll('.seq-lineup-parent')
       .forEach(b => b.classList.remove('active'));

    if (!isOpen) {
      submenu.style.display = 'block';
      btn.classList.add('active');
    }
  };

  window.closeAllSeqDropdowns = function() {
    document.querySelectorAll('.seq-lineup-dropdown').forEach(d => d.style.display = 'none');
    document.querySelectorAll('.seq-lineup-submenu').forEach(s => s.style.display = 'none');
    document.querySelectorAll('.seq-lineup-parent').forEach(b => b.classList.remove('active'));
  };

  function closeSimpleZipMenu() {
    document.querySelectorAll('.seq-zip-context-menu').forEach(m => m.remove());
  }

/* ── Right-click on seq-summary opens the full dropdown (sequence + per-dept) ── */
  document.addEventListener('contextmenu', function(e) {
    const summary = e.target.closest('.seq-summary');

    if (summary) {
      e.preventDefault();
      e.stopPropagation();
      closeAllSeqDropdowns();
      closeSimpleZipMenu();

      const dropdown = summary.querySelector('.seq-lineup-dropdown');
      if (!dropdown) return;

      window.buildSeqDropdown(dropdown);

      dropdown.style.display = 'block';
      dropdown.style.left = '-9999px';
      dropdown.style.top  = '-9999px';

      requestAnimationFrame(() => {
        const mw = dropdown.offsetWidth  || 220;
        const mh = dropdown.offsetHeight || 100;
        dropdown.style.left = Math.min(e.clientX, window.innerWidth  - mw - 8) + 'px';
        dropdown.style.top  = Math.min(e.clientY, window.innerHeight - mh - 8) + 'px';
      });
      return;
    }

    /* ── Right-click on a shot or shot+dept row — simple single-option menu ── */
    const node = e.target.closest('.zip-dl-node');
    if (!node) {
      closeAllSeqDropdowns();
      closeSimpleZipMenu();
      return;
    }

    e.preventDefault();
    e.stopPropagation();
    closeAllSeqDropdowns();
    closeSimpleZipMenu();

    const project = node.dataset.dlProject;

    const menu = document.createElement('div');
    menu.className = 'seq-zip-context-menu';
    menu.innerHTML = `
      <button type="button" data-action="zip">
        <i class="fas fa-file-zipper"></i>
        <span>Download ${project} as ZIP</span>
      </button>
    `;
    document.body.appendChild(menu);

    menu.querySelector('[data-action="zip"]').addEventListener('click', () => {
      closeSimpleZipMenu();
      window.treeDownload.start({
        dlLevel: node.dataset.dlLevel,
        dlProject: node.dataset.dlProject,
        dlSeq: node.dataset.dlSeq,
        dlShot: node.dataset.dlShot,
        dlDept: node.dataset.dlDept,
        dlMode: 'Sequence',
      });
    });

    menu.style.left = '-9999px';
    menu.style.top = '-9999px';
    requestAnimationFrame(() => {
      const mw = menu.offsetWidth || 200;
      const mh = menu.offsetHeight || 44;
      menu.style.left = Math.min(e.clientX, window.innerWidth - mw - 8) + 'px';
      menu.style.top = Math.min(e.clientY, window.innerHeight - mh - 8) + 'px';
    });
  });

  /* ── Click anywhere outside closes dropdowns/menus ── */
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.seq-lineup-dropdown')) {
      closeAllSeqDropdowns();
    }
    if (!e.target.closest('.seq-zip-context-menu')) {
      closeSimpleZipMenu();
    }
  });

}

/* ────────────────────────────────────────────────────────────
   window.treeDownload — actually performs the zip download.
   Sends seq/shot/dept as separate POST fields so the backend can
   filter to exactly the right scope (sequence, department, shot,
   or shot+department).
   ──────────────────────────────────────────────────────────── */
if (!window.treeDownload) {

  function tdGetCsrfToken() {
    const m = document.cookie.match(/csrftoken=([^;]+)/);
    return m ? m[1] : '';
  }

  function tdEnsureContainer() {
    let c = document.getElementById('zipProgressContainer');
    if (!c) {
      c = document.createElement('div');
      c.id = 'zipProgressContainer';
      document.body.appendChild(c);
    }
    return c;
  }

  function tdMakeCard(jobId, label) {
    const container = tdEnsureContainer();
    const card = document.createElement('div');
    card.className = 'zip-progress-card';
    card.id = `zip-card-${jobId}`;
    card.innerHTML = `
      <div class="zp-title">
        <span>Zipping ${label}</span>
        <button type="button" data-action="cancel">✕</button>
      </div>
      <div class="zp-bar-track"><div class="zp-bar-fill" style="width:0%"></div></div>
      <div class="zp-status">Starting…</div>
    `;
    container.appendChild(card);

    card.querySelector('[data-action="cancel"]').addEventListener('click', () => {
      fetch(`/zip/cancel/${jobId}/`, { method: 'POST', headers: {'X-CSRFToken': tdGetCsrfToken()} })
        .catch(() => {});
      card.remove();
    });

    return card;
  }

  function tdPollJob(jobId, label) {
    const card = tdMakeCard(jobId, label);
    const bar = card.querySelector('.zp-bar-fill');
    const status = card.querySelector('.zp-status');

    const interval = setInterval(async () => {
      if (!document.body.contains(card)) { clearInterval(interval); return; }

      try {
        const res = await fetch(`/zip/status/?job_id=${jobId}`);
        const data = await res.json();

        if (data.error && !data.status) {
          clearInterval(interval);
          status.textContent = data.error;
          card.classList.add('zp-error');
          return;
        }

        bar.style.width = `${data.progress || 0}%`;

        if (data.status === 'queued' || data.status === 'running') {
          status.textContent = `${data.files_done || 0} / ${data.files_total || '?'} files…`;
        } else if (data.status === 'done') {
          clearInterval(interval);
          status.textContent = 'Done — downloading…';
          card.classList.add('zp-done');
          window.location.href = data.output_web;
          setTimeout(() => card.remove(), 4000);
        } else if (data.status === 'failed') {
          clearInterval(interval);
          status.textContent = data.error || 'Failed';
          card.classList.add('zp-error');
        } else if (data.status === 'cancelled') {
          clearInterval(interval);
          status.textContent = 'Cancelled';
          card.remove();
        }
      } catch (e) {
        clearInterval(interval);
        status.textContent = 'Error checking status';
        card.classList.add('zp-error');
      }
    }, 1000);
  }

  window.treeDownload = {
    start(opts) {
      const project  = opts.dlProject;
      const category = opts.dlMode || 'Sequence';
      const seq   = opts.dlSeq || '';
      const shot  = (opts.dlLevel === 'shot' || opts.dlLevel === 'shot_dept') ? (opts.dlShot || '') : '';
      const dept  = (opts.dlLevel === 'department' || opts.dlLevel === 'shot_dept') ? (opts.dlDept || '') : '';

      const label = [project, seq, shot, dept].filter(Boolean).join(' / ');

      (async () => {
        try {
          const res = await fetch('/zip/start/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded',
              'X-CSRFToken': tdGetCsrfToken(),
            },
            body: new URLSearchParams({ project, category, path: seq, shot, dept }),
          });
          const data = await res.json();

          if (data.error) {
            if (window.Toast) Toast.error(data.error, 'Zip Failed');
            return;
          }
          tdPollJob(data.job_id, label);
        } catch (e) {
          if (window.Toast) Toast.error('Could not start zip job', 'Error');
        }
      })();
    }
  };
}
</script>
